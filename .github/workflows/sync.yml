name: Sync Integration Data
on:
  repository_dispatch:
    types: [sdk-released]

# Queue concurrent release events so git pushes never conflict
concurrency:
  group: registry-write
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update & Aggregate Data
        run: |
          mkdir -p public/data

          echo 'Updating {{github.event.client_payload.client_payload.integration.id}}'
          
          # Write incoming payload
          echo '${{ toJson(github.event.client_payload) }}' > "public/data/${{ github.event.client_payload.client_payload.integration.id }}.json"
          
          # Merge all integrations into one array
          jq -s '.' public/data/*.json > public/all-integrations.json

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update ${{ github.event.client_payload.id }} to ${{ github.event.client_payload.version }}"
          file_pattern: "public/*"
